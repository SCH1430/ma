      <svg class="math-atlas" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" fill="none" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="atlas-grid" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0H0V64" stroke="#54735c" stroke-opacity=".13" stroke-width=".65"/>
            <circle cx="1" cy="1" r="1" fill="#54735c" fill-opacity=".17"/>
          </pattern>
          <radialGradient id="atlas-edge-fade" cx="50%" cy="43%" r="65%">
            <stop offset=".29" stop-color="#000"/><stop offset=".7" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff"/>
          </radialGradient>
          <mask id="atlas-edges"><rect width="1600" height="1000" fill="url(#atlas-edge-fade)"/></mask>
          <linearGradient id="atlas-crystal" x1="60" y1="290" x2="300" y2="580" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff" stop-opacity=".9"/><stop offset=".46" stop-color="#e3edcf" stop-opacity=".35"/><stop offset="1" stop-color="#86a684" stop-opacity=".2"/>
          </linearGradient>
          <linearGradient id="atlas-crystal-shade" x1="175" y1="215" x2="330" y2="540" gradientUnits="userSpaceOnUse">
            <stop stop-color="#b2c9a5" stop-opacity=".08"/><stop offset="1" stop-color="#77967b" stop-opacity=".23"/>
          </linearGradient>
          <linearGradient id="atlas-edge-light" x1="40" y1="215" x2="325" y2="635" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#71927c" stop-opacity=".25"/>
          </linearGradient>
          <radialGradient id="atlas-globe" cx="29%" cy="25%" r="80%">
            <stop stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#e1eee6" stop-opacity=".2"/><stop offset=".83" stop-color="#82ab96" stop-opacity=".18"/><stop offset="1" stop-color="#eaf5e8" stop-opacity=".5"/>
          </radialGradient>
          <linearGradient id="atlas-orbit" x1="-300" y1="-100" x2="270" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#88a38d" stop-opacity=".12"/><stop offset=".44" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#6b8b73" stop-opacity=".34"/>
          </linearGradient>
          <linearGradient id="atlas-curve" x1="100" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6b8b5b" stop-opacity="0"/><stop offset=".3" stop-color="#6b8b5b" stop-opacity=".6"/><stop offset=".8" stop-color="#6b8b5b" stop-opacity=".6"/><stop offset="1" stop-color="#6b8b5b" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="atlas-globe-clip"><circle r="226"/></clipPath>
        </defs>
        <rect width="1600" height="1000" fill="url(#atlas-grid)" mask="url(#atlas-edges)"/>

        <!-- An octahedron: translucent faces, construction lines, lit edges. -->
        <g class="atlas-solid">
          <ellipse cx="183" cy="660" rx="126" ry="17" fill="#73906a" opacity=".035"/>
          <g class="atlas-line" opacity=".15">
            <ellipse cx="180" cy="423" rx="205" ry="78" transform="rotate(-23 180 423)"/>
            <path d="M175 175V677M12 437 361 365" stroke-dasharray="3 8"/>
            <circle cx="175" cy="423" r="204" stroke-dasharray="1 12"/>
          </g>
          <path d="m175 215-130 200 135 65Z" fill="url(#atlas-crystal)"/>
          <path d="m175 215 150 175-145 90Z" fill="url(#atlas-crystal-shade)"/>
          <path d="m45 415 151 220-16-155Z" fill="#edf4df" fill-opacity=".36"/>
          <path d="m180 480 145-90-129 245Z" fill="url(#atlas-crystal)"/>
          <g class="atlas-line" stroke-opacity=".2">
            <path d="m175 215 15 115 135 60M45 415l145-85 6 305" stroke-dasharray="4 6"/>
            <path d="m175 215-130 200 151 220 129-245-150-175 5 265-135-65m135 65 145-90m-145 90 16 155"/>
          </g>
          <path d="m45 415 130-200 5 265 145-90M45 415l135 65 16 155" stroke="url(#atlas-edge-light)" stroke-width="1.8" stroke-linejoin="round"/>
          <g fill="#6e8d70" fill-opacity=".45" stroke="#f4f8ed" stroke-width="3">
            <circle cx="175" cy="215" r="4"/><circle cx="325" cy="390" r="4"/><circle cx="180" cy="480" r="4"/><circle cx="196" cy="635" r="4"/>
          </g>
          <g class="atlas-label" opacity=".45"><text x="158" y="197">A</text><text x="338" y="394">B</text><text x="197" y="488">O</text></g>
        </g>

        <!-- A spherical coordinate net and an oblique orbital section. -->
        <g class="atlas-sphere">
          <g transform="translate(1445 438) rotate(-23)">
            <circle r="254" stroke="#6c907b" stroke-opacity=".1" stroke-dasharray="2 9"/>
            <circle r="238" stroke="#fff" stroke-opacity=".4" stroke-width="12"/>
            <circle r="226" fill="url(#atlas-globe)" stroke="#fafff6" stroke-opacity=".9" stroke-width="1.5"/>
            <g class="atlas-line" stroke-opacity=".23" clip-path="url(#atlas-globe-clip)">
              <ellipse rx="63" ry="226"/><ellipse rx="139" ry="226"/><ellipse rx="198" ry="226"/>
              <ellipse rx="226" ry="57"/><ellipse rx="226" ry="133"/><ellipse rx="226" ry="195"/>
              <path d="M-226 0h452M0-226v452" stroke-opacity=".35"/>
            </g>
            <path d="M-160-160A226 226 0 0 1 160-160" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/>
            <ellipse rx="306" ry="91" transform="rotate(-32)" stroke="url(#atlas-orbit)" stroke-width="1.5"/>
            <g transform="rotate(-32)">
              <circle cx="-249" cy="53" r="10" fill="#fff" fill-opacity=".38"/>
              <circle cx="-249" cy="53" r="4" fill="#b3995d" fill-opacity=".75"/>
              <path d="M-318 0h22M296 0h22" stroke="#75927b" stroke-opacity=".3"/>
            </g>
          </g>
        </g>

        <!-- Function sketches, set away from the reading area. -->
        <g class="atlas-functions">
          <g class="atlas-line" opacity=".23">
            <path d="M125 836h330m-6-4 6 4-6 4M270 900V713m-4 6 4-6 4 6"/>
            <path d="M172 832v8m49-8v8m98-8v8m49-8v8M266 786h8m-8-50h8m-8 150h8"/>
            <path d="M172 736h98m98 0H270M172 736v100m196-100v100" stroke-dasharray="3 7" opacity=".5"/>
          </g>
          <path d="M154 696Q270 976 386 696" stroke="url(#atlas-curve)" stroke-width="1.8"/>
          <circle cx="319" cy="811" r="3" fill="#8aa16f" fill-opacity=".65"/>
          <g class="atlas-label" opacity=".42"><text x="354" y="743">y = x²</text><text x="460" y="841">x</text><text x="279" y="718">y</text><text x="251" y="856" font-size="13">0</text></g>
          <g transform="translate(1045 810)">
            <g class="atlas-line" opacity=".2">
              <path d="M0 0h385m-6-4 6 4-6 4M50 71V-75m-4 6 4-6 4 6"/>
              <path d="M130-4v8m80-8v8m80-8v8M46-45h8m-8 90h8"/>
              <path d="M50-45h320M50 45h320" stroke-dasharray="2 8" opacity=".55"/>
            </g>
            <path d="M-30 0C-3 0-3 45 24 45S50 0 50 0C77-60 103-60 130 0S183 60 210 0 263-60 290 0 343 60 370 0" stroke="#a28a52" stroke-opacity=".42" stroke-width="1.6"/>
            <circle cx="90" cy="-45" r="3" fill="#b3995d" fill-opacity=".6"/>
            <g class="atlas-label" opacity=".4"><text x="242" y="-64">y = sin x</text><text x="391" y="5">x</text></g>
          </g>
        </g>

        <g class="atlas-annotations" opacity=".35">
          <g class="atlas-line"><path d="M367 187h16m-8-8v16M1180 180h16m-8-8v16M984 909h12m-6-6v12"/></g>
          <text class="atlas-micro" x="87" y="153">FIG. 01</text>
          <text class="atlas-label" x="1251" y="168" font-size="23">ℝ³</text>
          <circle cx="1134" cy="229" r="3" stroke="#8a9e75"/>
          <path d="M1134 216v-34h43" stroke="#78936f" stroke-opacity=".4" stroke-dasharray="2 5"/>
        </g>
      </svg>

    <header class="site-header">

        <div class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 26V13h13M33 14v13H20M13 31l14-22"/></svg></div>

        </div>
        <div class="choices reveal" role="group" aria-label="Выберите свою роль">
          <button class="role-card student" type="button" data-role="student" aria-labelledby="student-title" aria-describedby="student-description">
            <span class="card-top"><span class="role-icon"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 13 14-7 14 7-14 7-14-7Z"/><path d="M10 16v9c4 4 12 4 16 0v-9M32 14v10"/><circle cx="32" cy="26" r="1" fill="currentColor" stroke="none"/></svg></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M10 5l5 5-5 5"/></svg></span></span>
            <span class="card-copy"><span class="role-title" id="student-title">Ученик</span><span class="role-description" id="student-description">Исследовать и открывать</span></span>
          </button>
          <button class="role-card teacher" type="button" data-role="teacher" aria-labelledby="teacher-title" aria-describedby="teacher-description">
            <span class="card-top"><span class="role-icon"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h26v19H5zM12 31l6-6 6 6M18 25v7M11 19l5-6 5 3 5-5"/><path d="M22 11h4v4"/></svg></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M10 5l5 5-5 5"/></svg></span></span>
            <span class="card-copy"><span class="role-title" id="teacher-title">Учитель</span><span class="role-description" id="teacher-description">Объяснять и вдохновлять</span></span>
          </button>
        </div>
        <p class="choice-hint">Выберите свою роль <span aria-hidden="true">↗</span> и начнём</p>
      </section>
      <section id="app" class="app-shell" hidden aria-label="Математическое пространство"></section>
    </main>
