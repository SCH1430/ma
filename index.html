// One local bank serves both the trainer and the print constructor.
function parseAnswer(raw) {
  const value=String(raw).trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s+/g,'');
  const number='[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';
  if(!new RegExp(`^${number}(?:/${number})?$`).test(value)) return null;
  const parts=value.split('/').map(Number);
  if(parts.length===2 && parts[1]===0) return null;
  const result=parts.length===2 ? parts[0]/parts[1] : parts[0];
  return Number.isFinite(result) ? result : null;
}
function answerMatches(raw,expected) {
  const value=parseAnswer(raw);
  return value!==null && Math.abs(value-expected)<=1e-8*Math.max(1,Math.abs(expected));
}

  const action=(key,label,cls='secondary',attrs='')=>`<button type="button" class="${cls}" data-action="${key}" ${attrs}>${label}</button>`;
  const note=()=>`<div class="bottom-note"><span>Авторский стартовый банк по темам ФРП · 23.10.2026</span>${action('help','О программе и заданиях','text-button')}</div>`;
  const header=(title,subtitle)=>`<div class="screen-head"><div class="trail">${action('back','← Назад','text-button')}<span>${roleLabel()}${route.grade?` · ${route.grade} класс`:''}</span>${route.grade>=10?'<span class="badge">Базовый уровень</span>':''}</div><h1 tabindex="-1" id="screen-title">${esc(title)}</h1><p>${esc(subtitle)}</p></div>`;
  function notify(text){ $('notice').textContent=text; $('notice').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$('notice').hidden=true;},2400); }
  function go(view,data={}) {
    route={...route,...data,view};
    history.pushState({mat1430:true,route},'',`#${view}`);
    render(true);
  }
  function back(){ history.back(); }
  function render(focus=false){
    $('welcome').hidden=route.view!=='home'; $('app').hidden=route.view==='home';
    document.body.classList.toggle('app-mode',route.view!=='home');
    document.title=route.view==='home'?baseTitle:`1430 — ${roleLabel()}${route.grade?` · ${route.grade} класс`:''}`;
    document.querySelector('.skip-link').textContent=route.view==='home'?'Перейти к выбору роли':'Перейти к содержимому';
    if(route.view==='home') {
      $('app').innerHTML='';
      if(focus){document.querySelector('[data-role="student"]').focus({preventScroll:true});window.scrollTo(0,0);}
      return;
    }
    if(!route.role){route={...route,view:'home'};render(focus);return;}
    const pages={classes:renderClasses,profile:renderProfile,topics:renderTopics,train:renderTrainer,result:renderResult,builder:renderBuilder,print:renderPrint,help:renderHelp};
    if(!pages[route.view]) return;
    $('app').innerHTML=pages[route.view]();
    if(focus){window.scrollTo(0,0);$('screen-title')?.focus({preventScroll:true});}
  }
  function renderClasses(){
    return header('В каком вы классе?',route.role==='teacher'?'Выберите класс для тренажёра и печатной работы.':'Выберите свой класс. Дальше — знакомство и тема урока.')+
      `<div class="class-grid">${Array.from({length:7},(_,i)=>i+5).map(g=>`<button type="button" class="glass class-card" data-action="grade" data-grade="${g}" aria-label="${g} класс"><strong>${g}<small>класс</small></strong><span>${BANK.filter(t=>t.grade===g).length} тем · ${g>=10?'базовый уровень':'стартовый банк'}</span></button>`).join('')}</div>`+note();
  }
  function renderProfile(){
    return header('Давайте познакомимся.',`${route.grade} класс. Как к вам обращаться?`)+
      `<form id="profile-form" class="glass profile"><div class="field-grid"><label class="field" for="first-name">Имя<input id="first-name" name="first" required maxlength="40" autocomplete="off" value="${esc(student.first)}" placeholder="Например, Саша"></label><label class="field" for="last-name">Фамилия<input id="last-name" name="last" required maxlength="60" autocomplete="off" value="${esc(student.last)}" placeholder="Например, Иванова"></label></div><label class="field letter-field" for="class-letter">Буква класса<input id="class-letter" name="letter" required maxlength="1" pattern="[А-Яа-яЁёA-Za-z]" autocomplete="off" value="${esc(student.letter)}" placeholder="А" title="Одна буква класса"></label><p class="muted">Имя используется только в этой вкладке. После перезагрузки оно исчезнет; на сервер ничего не отправляется.</p><button class="primary" type="submit">Выбрать тему →</button></form>`;
  }
  function renderTopics(){
    const intro=route.role==='teacher'?'Откройте тренажёр для просмотра или соберите задания в печатную работу.':`${student.first}, выберите тему, которую назвал учитель на уроке.`;
    return header('Сегодня разбираемся.',intro)+`<div class="toolbar"><span class="badge">${topics().length} тем · ${topics().reduce((s,t)=>s+t.tasks.length,0)} задания${route.role==='student'?` · ${esc(student.first)} ${esc(student.last)}, ${route.grade}${esc(student.letter)}`:''}</span>${route.role==='teacher'?action('builder','Конструктор работы ↗','primary'):''}</div>`+
      `<div class="topic-grid">${topics().map(t=>`<article class="glass topic-card"><span class="subject">${esc(t.subject)}</span><h2>${esc(t.title)}</h2><p class="muted">3 задания · с объяснениями</p><div class="topic-actions">${action('train',route.role==='teacher'?'Посмотреть тренажёр':'Начать →','secondary',`data-topic="${t.id}"`)}${route.role==='teacher'?action('builder','В работу +','secondary',`data-topic="${t.id}"`):''}</div></article>`).join('')}</div>`+note();
  }
  function renderTrainer(){
    const t=currentTopic(),q=t.tasks[route.index],r=record(q.id),done=t.tasks.filter(x=>record(x.id).correct).length;
    return `<div class="trainer">`+header(t.title,route.role==='teacher'?'Режим учителя: тот же тренажёр и тот же банк заданий.':`${student.first}, решайте в своём темпе. Можно попробовать ещё раз или посмотреть объяснение.`)+
      `<div class="progress" role="progressbar" aria-label="Проверенные задания" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${done}"><span style="width:${done/3*100}%"></span></div><article class="glass task-card"><div class="task-meta"><span>${esc(t.subject)} · ${route.grade} класс</span><span>Задание ${route.index+1} из 3</span></div><h2 class="task-prompt">${esc(q.prompt)}</h2><form id="answer-form"><div class="answer-row"><label class="field" for="answer">Ваш ответ<input id="answer" name="answer" autocomplete="off" spellcheck="false" maxlength="60" inputmode="text" value="${esc(r.draft)}" ${r.correct?'readonly':''} aria-describedby="answer-format${r.feedback?' feedback':''}"></label><button type="submit" class="primary" ${r.correct?'disabled':''}>${r.correct?'Проверено ✓':'Проверить'}</button></div><p class="muted" id="answer-format">Число без единиц: 12, −3, 0,75 или 3/4. Для точного ответа используйте дробь.</p></form>${r.feedback?`<div id="feedback" class="feedback ${r.correct?'':'wrong'}" role="status"><strong>${r.correct?'Верно. Продолжаем!':r.feedback==='format'?'Проверьте запись ответа.':'Пока не сходится.'}</strong><p>${r.correct?esc(q.solution):r.feedback==='format'?'Введите число или дробь вида 3/4. Знаменатель не должен быть нулём.':'Попробуйте ещё раз. Если нужна помощь, откройте объяснение.'}</p></div>`:''}${!r.correct?action('reveal',r.revealed?'Объяснение открыто':'Показать объяснение','text-button',r.revealed?'disabled':''):''}${r.revealed&&!r.correct?`<div class="solution"><strong>Ответ: ${esc(q.display.replace('.',','))}.</strong> ${esc(q.solution)}</div>`:''}</article><div class="task-nav"><div class="dots" aria-label="Номер задания">${t.tasks.map((x,i)=>action('task',String(i+1),`task-dot ${record(x.id).correct?'done':''}`,`data-index="${i}" aria-label="Задание ${i+1}${record(x.id).correct?', проверено':''}" ${i===route.index?'aria-current="step"':''}`)).join('')}</div>${action(route.index===2?'finish':'next',route.index===2?'Завершить →':'Следующее →','secondary')}</div></div>`;
  }
  function renderResult(){
    const t=currentTopic(),done=t.tasks.filter(q=>record(q.id).correct).length;
    return header('Ещё один шаг вперёд.',t.title)+`<section class="glass result"><span class="eyebrow">Практика завершена</span><div class="result-number">${done}<span class="muted"> / 3</span></div><h2>Задания с верным ответом</h2><p class="muted">Это практика, а не оценка. Можно вернуться к теме и разобрать оставшиеся задания.</p><div class="toolbar">${action('repeat','Начать заново','secondary')}${action('topics','К темам →','primary')}</div></section>`;
  }
  function renderBuilder(){
    if(route.role!=='teacher')return header('Выберите тему','Конструктор доступен в режиме учителя.');
    const w=work(),list=allTasks.filter(q=>q.grade===route.grade&&(filter==='all'||q.topicId===filter));
    return header('Соберите свою работу.','Выбирайте задания из разных тем. Порядок можно изменить; ответы печатаются отдельно и только по вашему выбору.')+
      `<div class="builder-grid"><section><div class="toolbar"><label class="field" style="width:100%" for="bank-filter">Тема в общем банке<select id="bank-filter"><option value="all">Все темы · ${route.grade} класс</option>${topics().map(t=>`<option value="${t.id}" ${filter===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label></div><div id="bank-list">${list.map(q=>`<article class="glass bank-task"><h3>${esc(q.topic)} · № ${q.id}</h3><p>${esc(q.prompt)}</p>${action(w.ids.includes(q.id)?'remove':'add',w.ids.includes(q.id)?'✓ Добавлено · убрать':'Добавить в работу +','secondary',`data-id="${q.id}" ${!w.ids.includes(q.id)&&w.ids.length>=24?'disabled':''}`)}</article>`).join('')}</div></section><aside class="glass work-panel"><h2>В работе <span class="badge">${w.ids.length} / 24</span></h2><label class="field" for="work-title">Название<input id="work-title" maxlength="70" value="${esc(w.title)}"></label><label class="field" for="work-variant">Вариант<input id="work-variant" maxlength="20" value="${esc(w.variant)}"></label>${w.ids.length?`<ol class="work-list">${w.ids.map((id,i)=>`<li><p><strong>${i+1}.</strong> ${esc(question(id).prompt)}</p><div class="mini-actions">${action('up','↑','',`data-id="${id}" aria-label="Поднять задание ${i+1}" ${i===0?'disabled':''}`)}${action('down','↓','',`data-id="${id}" aria-label="Опустить задание ${i+1}" ${i===w.ids.length-1?'disabled':''}`)}${action('remove','Удалить','',`data-id="${id}" aria-label="Удалить задание ${i+1}"`)}</div></li>`).join('')}</ol>`:'<p class="empty">Пока здесь пусто. Добавьте первое задание из банка.</p>'}<label class="check"><input id="include-answers" type="checkbox" ${w.answers?'checked':''}>Включить ответы и объяснения на отдельных страницах для учителя</label>${action('print-preview','Предпросмотр A4 →','primary',w.ids.length?'':'disabled')}<p class="muted">До 24 заданий. В работе будет место для решений. PDF сохраняется через диалог печати браузера.</p></aside></div>`;
  }
  function printMarkup(){
    const w=work(),tasks=w.ids.map(question),pages=[];
    const top=(isKey)=>`<div class="sheet-header"><div class="sheet-brand">1430 × МАТЕМАТИКА</div><h2>${esc(w.title.trim()||'Самостоятельная работа')}${isKey?' · ответы':''}</h2><div class="sheet-meta">${route.grade} класс${route.grade>=10?' · базовый уровень':''} · Вариант ${esc(w.variant.trim()||'1')}${isKey?' · Для учителя':''}</div></div>`;
    for(let i=0;i<tasks.length;i+=3) pages.push(`${top(false)}<div class="name-line">Имя и фамилия: __________________________ Класс: ______</div>${tasks.slice(i,i+3).map((q,j)=>`<section class="print-question"><p><strong>${i+j+1}.</strong> ${esc(q.prompt)}</p><div class="solution-lines" aria-label="Место для решения"></div></section>`).join('')}`);
    if(w.answers)for(let i=0;i<tasks.length;i+=6)pages.push(`${top(true)}${tasks.slice(i,i+6).map((q,j)=>`<section class="answer-key"><strong>${i+j+1}. Ответ: ${esc(q.display.replace('.',','))}.</strong><p>${esc(q.solution)}</p></section>`).join('')}`);
    return pages.map((html,i)=>`<article class="sheet">${html}<div class="sheet-footer"><span>Авторские задания по темам ФРП · школа 1430</span><span>${i+1} / ${pages.length}</span></div></article>`).join('');
  }
  function renderPrint(){
    if(route.role!=='teacher'||!work().ids.length)return header('Работа пока пуста.','Вернитесь в конструктор и добавьте задания.');
    return header('Готово к печати.',`${work().ids.length} заданий · ${work().answers?'ответы включены отдельными страницами':'без ответов'}`)+`<div class="print-instructions glass" style="padding:20px"><strong>Как получить PDF</strong><p>Нажмите «Печать / сохранить PDF». В системном диалоге выберите сохранение в PDF, формат A4, масштаб 100% и отключите колонтитулы браузера. Это откроет диалог печати, а не скачает файл автоматически.</p>${action('print','Печать / сохранить PDF','primary')}</div><div class="print-root">${printMarkup()}</div>`;
  }
  function renderHelp(){
    return header('Откуда берутся темы.','Проверено 23 октября 2026 года. Стартовый банк для практики на уроке.')+`<article class="glass source-box"><h2>Программа и авторские задания</h2><p>Темы распределены по классам на основе федеральных рабочих программ, размещённых на ЕДСОО. Все ${allTasks.length} упражнения составлены для этого сайта. Они не являются официальным банком ФРП. Здесь ${BANK.length} тема; это выборка, а не полное покрытие программы. В 10–11 классах выбран базовый уровень.</p><p><a href="${source59}" target="_blank" rel="noopener noreferrer">ФРП «Математика», 5–9 классы, базовый уровень (2025)</a><br><a href="${source1011}" target="_blank" rel="noopener noreferrer">ФРП «Математика», 10–11 классы, базовый уровень (2025)</a><br><a href="https://edsoo.ru/rabochie-programmy/" target="_blank" rel="noopener noreferrer">Официальный каталог ЕДСОО</a></p><p class="muted">Использованы документы, доступные в официальном каталоге на дату проверки. Перед расширением банка нужно повторно сверить актуальные редакции. Ссылки открываются в интернете; сам тренажёр работает без подключения.</p><table><thead><tr><th>Класс</th><th>Темы стартового банка</th><th>Страницы ФРП</th></tr></thead><tbody>${Array.from({length:7},(_,i)=>i+5).map(g=>{const ts=BANK.filter(t=>t.grade===g);return `<tr><th>${g}${g>=10?'<br>базовый':''}</th><td>${ts.map(t=>esc(t.title)).join('; ')}.<br><strong>${ts.length} тем · ${ts.length*3} задания</strong></td><td>${[...new Set(ts.map(t=>t.ref))].join(', ')}</td></tr>`;}).join('')}</tbody></table><h2>Как проверяется ответ</h2><p>Все задания имеют числовой ответ. Можно использовать точку, запятую или дробь a/b, в том числе несокращённую. Единицы измерения вводить не нужно. Для бесконечной десятичной дроби вводите точную обыкновенную дробь. Объяснение доступно в каждом задании.</p><h2>Локальная работа</h2><p>Имя, фамилия, буква класса, ответы и состав печатной работы хранятся только в памяти открытой вкладки. Перезагрузка страницы очищает их. Выбор роли меняет доступные действия интерфейса; это не система авторизации.</p></article>`;
  }
  document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>go('classes',{role:b.dataset.role,grade:null,topic:null,index:0})));
  $('app').addEventListener('input',event=>{
    const e=event.target;
    if(e.id==='answer')record(currentTopic().tasks[route.index].id).draft=e.value;
    if(e.id==='work-title')work().title=e.value;
    if(e.id==='work-variant')work().variant=e.value;
    if(e.id==='first-name')student.first=e.value;
    if(e.id==='last-name')student.last=e.value;
    if(e.id==='class-letter')student.letter=e.value.toUpperCase();
  });
  $('app').addEventListener('change',event=>{
    if(event.target.id==='bank-filter'){filter=event.target.value;render();$('bank-filter').focus();}
    if(event.target.id==='include-answers')work().answers=event.target.checked;
  });
  $('app').addEventListener('submit',event=>{
    event.preventDefault();
    if(event.target.id==='profile-form'){
      const first=$('first-name'),last=$('last-name');
      first.setCustomValidity(first.value.trim()?'':'Введите имя.');last.setCustomValidity(last.value.trim()?'':'Введите фамилию.');
      if(!event.target.reportValidity())return;
      student.first=first.value.trim();student.last=last.value.trim();student.letter=$('class-letter').value.toUpperCase();go('topics');
    }
    if(event.target.id==='answer-form'){
      const q=currentTopic().tasks[route.index],r=record(q.id);r.draft=$('answer').value;
      if(parseAnswer(r.draft)===null)r.feedback='format';
      else {r.tries++;r.correct=answerMatches(r.draft,q.answer);r.feedback=r.correct?'correct':'wrong';}
      render();$('answer').focus({preventScroll:true});
    }
  });
  $('app').addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
    const a=b.dataset.action,id=b.dataset.id;
    if(a==='back'){back();return;}
    if(a==='help'){go('help');return;}
    if(a==='grade'){go(route.role==='teacher'?'topics':'profile',{grade:Number(b.dataset.grade),topic:null,index:0});return;}
    if(a==='topics'){go('topics');return;}
    if(a==='train'){go('train',{topic:b.dataset.topic,index:0});return;}
    if(a==='task'||a==='next'){
      route={...route,index:a==='task'?Number(b.dataset.index):route.index+1};history.replaceState({mat1430:true,route},'', '#train');render(true);return;
    }
    if(a==='finish'){go('result');return;}
    if(a==='reveal'){record(currentTopic().tasks[route.index].id).revealed=true;render();$('answer').focus({preventScroll:true});return;}
    if(a==='repeat'){currentTopic().tasks.forEach(q=>attempts.delete(`${route.role}:${q.id}`));go('train',{index:0});return;}
    if(route.role!=='teacher')return;
    if(a==='builder'){filter=b.dataset.topic||'all';go('builder');return;}
    if(a==='add'||a==='remove'||a==='up'||a==='down'){
      const w=work(),i=w.ids.indexOf(id);
      if(a==='add'&&i<0&&w.ids.length<24){w.ids.push(id);notify('Задание добавлено в работу');}
      if(a==='remove'&&i>=0){w.ids.splice(i,1);notify('Задание удалено');}
      if(a==='up'&&i>0)[w.ids[i-1],w.ids[i]]=[w.ids[i],w.ids[i-1]];
      if(a==='down'&&i>=0&&i<w.ids.length-1)[w.ids[i+1],w.ids[i]]=[w.ids[i],w.ids[i+1]];
      const scroll=window.scrollY;render();window.scrollTo(0,scroll);
      const same=[...$('app').querySelectorAll('[data-action]')].find(x=>x.dataset.id===id&&(x.dataset.action===a||x.dataset.action===(a==='add'?'remove':'add')));
      same?.focus({preventScroll:true});return;
    }
    if(a==='print-preview'&&work().ids.length){go('print');return;}
    if(a==='print'){window.print();return;}
  });
  // Clear field errors as soon as the user edits, before native form validation.
  $('app').addEventListener('input',e=>{if(e.target.matches('#first-name,#last-name'))e.target.setCustomValidity('');});
  window.addEventListener('popstate',event=>{route=event.state?.mat1430?event.state.route:{view:'home',role:null,grade:null,topic:null,index:0};render(true);});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&route.view!=='home'){event.preventDefault();back();}});
  history.replaceState({mat1430:true,route},'', '#home');
  render();
})();

  </script>
</body>
</html>
