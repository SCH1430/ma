<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf2ee">
  <meta name="description" content="Математическое пространство школы 1430. Всё начинается с любопытства.">
  <title>1430 — пространство математики</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23243f35'/%3E%3Cpath d='M17 40V24h16M47 24v16H31M23 45l18-26' stroke='%23e8f6c8' fill='none' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="data/shell.css">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к выбору роли</a>
  <div class="page">
    <div class="landscape" aria-hidden="true">
      <div class="sphere"></div>
      <div class="orbit"><div class="orbit-ring"></div><div class="orbit-line"></div></div>
      <div class="glass-cube"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 20h20M20 10v20"/></svg></div>
      <span class="math-note note-a">x + y</span><span class="math-note note-b">∞</span>
      <i class="cross cross-a"></i><i class="cross cross-b"></i><i class="cross cross-c"></i>
    </div>
    <header class="site-header">
      <div class="brand" aria-label="Школа 1430">
        <div class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 26V13h13M33 14v13H20M13 31l14-22"/></svg></div>
        <div class="brand-name" aria-hidden="true"><small>ШКОЛА</small><strong>1430</strong></div>
      </div>
      <div class="header-note">У каждого свой путь</div>
    </header>
    <main id="main" tabindex="-1">
      <section class="welcome" id="welcome" aria-labelledby="welcome-title">
        <div class="reveal">
          <p class="eyebrow"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M3 14V6h8M17 6v8H9M6 17 14 3"/></svg>Пространство математики</p>
          <h1 id="welcome-title"><span>Всё начинается</span><span class="accent">с любопытства.</span></h1>
          <p class="intro">Место, где можно задавать вопросы,<br>находить решения и понимать больше.</p>
        </div>
        <div class="choices reveal" role="group" aria-label="Выберите свою роль">
          <button class="role-card student" type="button" data-role="student" aria-labelledby="student-title" aria-describedby="student-description">
            <span class="card-top"><span class="role-icon"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 13 14-7 14 7-14 7-14-7Z"/><path d="M10 16v9c4 4 12 4 16 0v-9M32 14v10"/><circle cx="32" cy="26" r="1" fill="currentColor" stroke="none"/></svg></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M10 5l5 5-5 5"/></svg></span></span>
            <span class="card-copy"><span class="role-title" id="student-title">Ученик</span><span class="role-description" id="student-description">Исследовать и открывать</span></span>
          </button>
          <button class="role-card teacher" type="button" data-role="teacher" aria-labelledby="teacher-title" aria-describedby="teacher-description">
            <span class="card-top"><span class="role-icon"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h26v19H5zM12 31l6-6 6 6M18 25v7M11 19l5-6 5 3 5-5"/><path d="M22 11h4v4"/></svg></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M10 5l5 5-5 5"/></svg></span></span>
            <span class="card-copy"><span class="role-title" id="teacher-title">Учитель</span><span class="role-description" id="teacher-description">Объяснять и вдохновлять</span></span>
          </button>
        </div>
        <p class="choice-hint">Выберите свою роль <span aria-hidden="true">↗</span> и начнём</p>
      </section>
      <section id="app" class="app-shell" hidden aria-label="Математическое пространство"></section>
    </main>
    <footer class="site-footer">
      <div class="footer-signature">1430 <span aria-hidden="true">×</span> МАТЕМАТИКА</div>
      <div class="footer-end"><span>От вопроса к открытию</span><span class="coordinate" aria-hidden="true">01 / ∞</span></div>
    </footer>
  </div>
  <div class="toast" id="notice" role="status" hidden></div>
  <noscript><p>Чтобы выбрать роль, включите JavaScript в браузере.</p></noscript>
  <!-- Third-party licenses: data/NOTICE.txt -->
  <script id="vendor-pdf-lib" defer src="src/vendor/pdf-lib.min.js"></script>
  <script id="vendor-fontkit" defer src="src/vendor/fontkit.umd.min.js"></script>
  <script defer src="data/bank-stats.js"></script>
  <script defer src="data/bank.js"></script>
  <script defer src="data/tasks/grade_05.js"></script>
  <script defer src="data/tasks/grade_06.js"></script>
  <script defer src="data/tasks/grade_07.js"></script>
  <script defer src="data/tasks/grade_08.js"></script>
  <script defer src="data/tasks/grade_09.js"></script>
  <script defer src="data/tasks/grade_10.js"></script>
  <script defer src="data/tasks/grade_11.js"></script>
  <script defer src="data/exams/oge.js"></script>
  <script defer src="data/exams/ege-basic.js"></script>
  <script defer src="data/exams/ege-profile.js"></script>
  <script defer src="data/competencies.js"></script>
  <script defer src="data/exam-difficulty.js"></script>
  <script defer src="data/font.js"></script>
  <script defer src="src/math-figures.js"></script>
  <script defer src="src/learning-support.js"></script>
  <script defer src="src/exam-support.js"></script>
  <script defer src="src/competency-support.js"></script>
  <script defer src="src/exam-difficulty.js"></script>
  <script defer src="src/auto-work.js"></script>
  <script defer src="src/pdf.js"></script>
  <script id="app-code" defer src="src/app.js"></script>
</body>
</html>
